backend:
  name: git-gateway
  branch: main

locale: de

media_folder: images
public_folder: /images

collections:
  - name: startseite
    label: Startseite
    files:
      - name: startseite
        label: Startseite – Inhalte
        file: content/startseite.json
        format: json
        fields:
          - { label: Über uns (Absatz 1), name: ueber_p1, widget: text }
          - { label: Über uns (Absatz 2), name: ueber_p2, widget: text }
          - { label: Über uns (Absatz 3), name: ueber_p3, widget: text }
          - { label: Unsere Ziele – Einleitung, name: ziele_intro, widget: text }
          - { label: Ziel 1 – Titel, name: ziel1_titel, widget: string }
          - { label: Ziel 1 – Text, name: ziel1_text, widget: text }
          - { label: Ziel 2 – Titel, name: ziel2_titel, widget: string }
          - { label: Ziel 2 – Text, name: ziel2_text, widget: text }
          - { label: Ziel 3 – Titel, name: ziel3_titel, widget: string }
          - { label: Ziel 3 – Text, name: ziel3_text, widget: text }
          - { label: Ziel 4 – Titel, name: ziel4_titel, widget: string }
          - { label: Ziel 4 – Text, name: ziel4_text, widget: text }
          - { label: Ziel 5 – Titel, name: ziel5_titel, widget: string }
          - { label: Ziel 5 – Text, name: ziel5_text, widget: text }
          - { label: Ziel 6 – Titel, name: ziel6_titel, widget: string }
          - { label: Ziel 6 – Text, name: ziel6_text, widget: text }
          - { label: Grußwort (Absatz 1), name: gruss_p1, widget: text }
          - { label: Grußwort (Absatz 2), name: gruss_p2, widget: text }
          - { label: Grußwort (Absatz 3), name: gruss_p3, widget: text }
          - { label: Grußwort (Absatz 4), name: gruss_p4, widget: text }
          - { label: Kontakt – E-Mail, name: kontakt_email, widget: string }
          - { label: Kontakt – Website, name: kontakt_website, widget: string }
          - { label: Kontakt – Adresse, name: kontakt_adresse, widget: text }

  - name: projekte
    label: Projekte
    files:
      - name: lesekonzerte
        label: Lesekonzerte
        file: content/lesekonzerte.json
        format: json
        fields:
          - { label: Titel, name: title, widget: string }
          - { label: Einleitung (Absatz 1), name: intro1, widget: text }
          - { label: Einleitung (Absatz 2), name: intro2, widget: text }
          - { label: Das Format (Absatz 1), name: format1, widget: text }
          - { label: Das Format (Absatz 2), name: format2, widget: text }
          - { label: Info-Box, name: infobox, widget: text }
          - { label: Mitmachen & Unterstützen, name: mitmachen, widget: text }

      - name: minikonzerte
        label: Mini-Konzerte
        file: content/minikonzerte.json
        format: json
        fields:
          - { label: Titel, name: title, widget: string }
          - { label: Einleitung (Absatz 1), name: intro1, widget: text }
          - { label: Einleitung (Absatz 2), name: intro2, widget: text }
          - { label: Orte – Einleitung, name: orte_intro, widget: string }
          - { label: Info-Box, name: infobox, widget: text }
          - { label: Mitmachen & Unterstützen, name: mitmachen, widget: text }

      - name: auftragswerke
        label: Auftragswerke
        file: content/auftragswerke.json
        format: json
        fields:
          - { label: Titel, name: title, widget: string }
          - { label: Einleitung (Absatz 1), name: intro1, widget: text }
          - { label: Einleitung (Absatz 2), name: intro2, widget: text }
          - { label: Werk 1 – Datum, name: werk1_datum, widget: string }
          - { label: Werk 1 – Titel, name: werk1_titel, widget: string }
          - { label: Werk 1 – Beschreibung, name: werk1_text, widget: text }
          - { label: Werk 2 – Datum, name: werk2_datum, widget: string }
          - { label: Werk 2 – Titel, name: werk2_titel, widget: string }
          - { label: Werk 2 – Beschreibung, name: werk2_text, widget: text }
          - { label: Info-Box, name: infobox, widget: text }
          - { label: Mitmachen & Unterstützen, name: mitmachen, widget: text }

      - name: education
        label: Education-Projekte
        file: content/education.json
        format: json
        fields:
          - { label: Titel, name: title, widget: string }
          - { label: Einleitung (Absatz 1), name: intro1, widget: text }
          - { label: Einleitung (Absatz 2), name: intro2, widget: text }
          - { label: Was die Kinder erleben – Einleitung, name: was_intro, widget: text }
          - { label: Was die Kinder erleben – Abschluss, name: was_text, widget: text }
          - { label: Info-Box, name: infobox, widget: text }
          - { label: Mitmachen & Unterstützen, name: mitmachen, widget: text }
